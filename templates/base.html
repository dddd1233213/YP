<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team Finder{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Team Finder</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/">Главная</a>
      <a class="nav-link" href="/users/list/">Пользователи</a>
    </div>
    <div class="navbar-nav ms-auto">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'users:profile' request.user.pk %}">Профиль</a>
        <a class="nav-link" href="{% url 'favorites:list' %}">Избранное</a>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-link nav-link">Выйти</button>
        </form>
      {% else %}
        <a class="nav-link" href="/users/login/">Войти</a>
        <a class="nav-link" href="/users/register/">Регистрация</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
