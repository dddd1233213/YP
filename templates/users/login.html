{% extends "base.html" %}
{% block title %}Вход — Team Finder{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="mb-3">
      {{ field.label_tag }}
      {{ field }}
      <div class="text-danger">{{ field.errors }}</div>
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Войти</button>
</form>
<p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
{% endblock %}
